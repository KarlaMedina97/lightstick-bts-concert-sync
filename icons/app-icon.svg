<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Purple Wave Sync">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0f57"/>
      <stop offset=".55" stop-color="#150836"/>
      <stop offset="1" stop-color="#07061a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0" stop-color="#b98cff" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#7a2bd6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#7a2bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#e9dcff" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#9a63ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5a1aa8" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#e4d3ff"/>
      <stop offset="1" stop-color="#b78bff"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0b14"/>
      <stop offset=".45" stop-color="#3a3548"/>
      <stop offset="1" stop-color="#0d0b14"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Fondo del ícono -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="214" r="230" fill="url(#halo)"/>

  <!-- Océano de luces en la base -->
  <g fill="#c9a6ff" opacity=".55">
    <circle cx="70" cy="452" r="7"/><circle cx="112" cy="440" r="6"/><circle cx="154" cy="456" r="7"/>
    <circle cx="358" cy="456" r="7"/><circle cx="400" cy="440" r="6"/><circle cx="442" cy="452" r="7"/>
  </g>

  <!-- Mango y unión -->
  <rect x="226" y="330" width="60" height="140" rx="22" fill="url(#handle)"/>
  <rect x="241" y="368" width="30" height="46" rx="15" fill="none" stroke="#d9d4e6" stroke-width="4"/>
  <rect x="204" y="318" width="104" height="30" rx="14" fill="#16131f"/>
  <rect x="210" y="318" width="92" height="5" rx="2.5" fill="#efe9ff" opacity=".8"/>

  <!-- Globo -->
  <circle cx="256" cy="206" r="132" fill="url(#glass)"/>
  <circle cx="256" cy="206" r="132" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="6"/>

  <!-- Ola tierna (emblema original del proyecto) -->
  <g transform="translate(256 228)">
    <path d="M-78 52 C-80 6 -54 -40 -8 -58 C30 -72 70 -56 82 -26 C90 -6 78 14 58 14 C40 14 30 0 36 -14 C14 -14 -4 6 -2 34 C0 46 4 52 8 56 Z"
          fill="url(#wave)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" filter="url(#soft)" opacity=".55"/>
    <path d="M-78 52 C-80 6 -54 -40 -8 -58 C30 -72 70 -56 82 -26 C90 -6 78 14 58 14 C40 14 30 0 36 -14 C14 -14 -4 6 -2 34 C0 46 4 52 8 56 Z"
          fill="url(#wave)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="-44" cy="-54" r="10" fill="#ffffff" opacity=".9"/>
    <circle cx="-62" cy="-30" r="6" fill="#ffffff" opacity=".75"/>
  </g>
  <!-- Destello -->
  <path d="M332 128 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" fill="#ffffff"/>
  <!-- Reflejo del vidrio -->
  <path d="M170 150 C186 116 216 96 252 90" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".7"/>
  <!-- Gema superior -->
  <rect x="236" y="64" width="40" height="16" rx="6" fill="#16131f"/>
  <path d="M244 64 l12 -14 12 14 z" fill="#e0245e"/>
</svg>
