name: Commits convencionales

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar mensajes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-commits.mjs "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            node scripts/check-commits.mjs "${{ github.event.before }}..${{ github.sha }}" || node scripts/check-commits.mjs HEAD~1..HEAD
          fi
