name: CI y despliegue

# Un solo pipeline: revisa commits, pruebas y CSP, y publica en GitHub Pages.
# Corre en el runner local (variable de repositorio RUNNER = pws-local). Si RUNNER no existe o vale
# ubuntu-latest, usa los runners de GitHub. Los pull requests SIEMPRE usan runners de GitHub: así el código
# de un fork nunca se ejecuta en esta PC.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".claude/**", ".github/dependabot.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Commits convencionales
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: node scripts/check-commits.mjs "$RANGE" || node scripts/check-commits.mjs HEAD~1..HEAD
      - name: Pruebas
        run: npm test
      - name: CSP al día
        run: npm run csp && git diff --exit-code -- index.html player/index.html

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read # para ver el paquete del sitio antes de publicarlo (paso «Esperar el paquete del sitio»)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # IndexNow compara con el commit anterior para saber si cambió el catálogo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Solo se publica lo que el sitio necesita (scripts/build-site.mjs): sin docs, pruebas ni configuración.
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub a veces tarda en listar el paquete recién subido y deploy-pages fallaba con «No artifacts named
      # github-pages» (2026-11-24, varias veces seguidas): se espera hasta verlo, como mucho 2 minutos.
      - name: Esperar el paquete del sitio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" -q '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then echo "Paquete visible tras $((i * 5)) s"; sleep 5; exit 0; fi
            sleep 5
          done
          echo "El paquete no apareció en 2 minutos; se intenta publicar igual."
      - id: deployment
        uses: actions/deploy-pages@v4
      # Avisa a Bing y demás buscadores de IndexNow (scripts/indexnow.mjs). Si cambió el catálogo, todas las páginas;
      # si no, solo las fijas. Un fallo aquí nunca frena la publicación.
      - name: IndexNow
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null             && git diff --name-only "$BEFORE" HEAD | grep -qE '^(src/catalog\.js|scripts/build-site\.mjs|sitemap\.xml)$'; then
            node scripts/indexnow.mjs --all
          else
            node scripts/indexnow.mjs
          fi
