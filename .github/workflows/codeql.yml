name: CodeQL

# Análisis semanal y en pull requests (ya no en cada push a main).
# Los pull requests usan runners de GitHub; el análisis semanal y el manual, el runner local si RUNNER está definido.
on:
  pull_request:
    paths: ["src/**", "scripts/**", "*.html", "**/*.js", ".github/workflows/codeql.yml"]
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          # vendor/ son librerías de terceros sin modificar (three.js, GSAP); se analiza solo código propio.
          config: |
            paths-ignore:
              - vendor
              - fonts
      - uses: github/codeql-action/analyze@v3
